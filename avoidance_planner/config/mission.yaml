/**:
  ros__parameters:
    # Цель в локальной ENU относительно точки взлёта: x — восток, y — север
    target_x: 0.0
    target_y: 60.0

    cruise_alt: 8.0          # выше здания не летим, но подальше от засветки землёй
    cruise_speed: 3.0
    goal_tolerance: 2.0

    clearance: 6.0           # зазор до стены при обходе, м
    detect_dist: 12.0        # дальность реакции в коридоре, м
    corridor_half: 2.5       # полуширина коридора, м
    max_range: 15.0          # обрезка дальномера (наклон корпуса даёт лучи в землю)

    mline_tol: 2.0           # допуск возврата на m-линию, м
    leave_margin: 3.0        # насколько ближе к цели, чем в точке встречи, м

    stuck_time: 6.0          # окно оценки перемещения, с
    stuck_move: 2.0          # минимальное перемещение за окно, м
    lidar_timeout: 1.5
    smooth: 0.25             # сглаживание команды скорости

    finish_action: 'land'
