/**:
  ros__parameters:
    # Цель в локальной ENU относительно точки взлёта: x — восток, y — север
    target_x: 0.0
    target_y: 60.0

    cruise_alt: 5.0          # рабочая высота, м
    cruise_speed: 3.0        # горизонтальная скорость, м/с
    goal_tolerance: 2.0      # радиус достижения цели, м

    clearance: 6.0           # зазор до препятствия при обходе, м
    detect_dist: 15.0        # дальность реакции на препятствие, м
    corridor_half: 3.0       # полуширина коридора движения, м
    max_range: 20.0          # обрезка дальномера (борьба с засветкой землёй), м

    stuck_time: 5.0          # окно оценки прогресса, с
    stuck_progress: 1.0      # минимальное продвижение за окно, м
    lidar_timeout: 1.5       # таймаут данных лидара, с

    finish_action: 'land'    # land | hold
